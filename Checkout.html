<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/b94258e1e9.js" crossorigin="anonymous"></script>
  <title>Checkout | Fluffies</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="navbar">
        <div class="logo-section">
          <div class="left">
            <input type="text" placeholder="Search our collection..." id="search" />
          </div>
          <div class="center">
            <img src="jellycat_logo_transparent.png" alt="Jellycat Logo" class="logo" />
         
        </div>
          <div class="right">
            <a href="login.html"><i class="fa-regular fa-user icon"></i></a>
            <!--<i class="fa-regular fa-heart icon"></i>--> 
            <a href="cart.html"><i class="fa-solid fa-bag-shopping icon"></i></a>
            <button id="menu-toggle" class="hamburger">&#9776;</button>
          </div>
        
        </div>
      
        <nav class="nav-links">
          <a href="home.html">HOME</a>
          <a href="product.html">SHOP</a>
          <a href="aboutus.html">ABOUT US</a>
          <a href="Contact.html">CONTACT</a>
        </nav>
      </header>

  <main class="checkout-container">
    <h2>Checkout</h2>
    <div class="checkout-columns">
      <form class="checkout-form">
        <h3>Billing Information</h3>
        <div class="input-group">
          <input type="text" placeholder="First Name" required />
          <input type="text" placeholder="Last Name" required />
        </div>
        <div class="input-group">
          <input type="email" placeholder="Email" required />
          <input type="tel" placeholder="Phone" required />
        </div>
        <input type="text" placeholder="Address" required />
        <div class="input-group">
          <input type="text" placeholder="City" required />
          <input type="text" placeholder="ZIP / Postal Code" required />
        </div>
        <select required>
          <option value="">Select Country</option>
          <option value="eg">Egypt</option>
          <option value="us">United States</option>
          <option value="de">Germany</option>
        </select>

        <h3>Shipping Method</h3>
        <label><input type="radio" name="shipping" checked /> Standard (3-5 days) - Free</label><br />
        <label><input type="radio" name="shipping" /> Express (1-2 days) - $7.99</label>

        <h3>Payment Method</h3>

<label>
  <input type="radio" name="payment" value="card" checked /> Credit / Debit Card
</label>
<div class="payment-fields" id="card-fields">
  <input type="text" placeholder="Cardholder Name" />
  <input type="text" placeholder="Card Number" />
  <div class="input-group">
    <input type="text" placeholder="Expiry (MM/YY)" />
    <input type="text" placeholder="CVV" />
  </div>
</div>

<label>
  <input type="radio" name="payment" value="paypal" /> PayPal
</label>
<div class="payment-fields" id="paypal-fields" style="display: none;">
  <input type="email" placeholder="PayPal Email" />
</div>

<label>
  <input type="radio" name="payment" value="cod" /> Cash on Delivery
</label>
<div class="payment-fields" id="cod-fields" style="display: none;">
  <p style="color: #333;">No payment info required — pay at delivery.</p>
</div>


        <button type="submit" class="place-order-btn">Place Order</button>
      </form>

      <div class="order-summary" id="order-summary">
        <h3>Order Summary</h3>
        <div id="summary-items"></div>
        <p class="total"><strong>Total: $<span id="summary-total">0.00</span></strong></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("show");
    });
  });
    document.addEventListener("DOMContentLoaded", () => {
      const cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const summaryContainer = document.getElementById("summary-items");
      const summaryTotal = document.getElementById("summary-total");

      let total = 0;
      cart.forEach(item => {
        const div = document.createElement("div");
        div.className = "summary-item";
        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}" />
          <div>
            <p><strong>${item.name}</strong></p>
            <p>Qty: ${item.qty || 1} | $${item.price} each</p>
          </div>
        `;
        summaryContainer.appendChild(div);
        total += item.price * (item.qty || 1);
      });

      summaryTotal.textContent = total.toFixed(2);
    });
    document.addEventListener("DOMContentLoaded", () => {
    const radios = document.querySelectorAll('input[name="payment"]');
    const sections = {
      card: document.getElementById("card-fields"),
      paypal: document.getElementById("paypal-fields"),
      cod: document.getElementById("cod-fields"),
    };

    radios.forEach(radio => {
      radio.addEventListener("change", () => {
        Object.keys(sections).forEach(method => {
          sections[method].style.display = (radio.value === method) ? "block" : "none";
        });
      });
    });
  });
  </script>
</body>
</html>
