<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jellycat Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="container">
    <img src="jellycat_logo_transparent.png" alt="Panda" class="panda-img" />
    <div class="login-box">
      <form>
        <label for="Fname">First name:</label>
        <input type="Fname" id="Fname" placeholder="Enter your First name " required />

        <label for="Lname">Last name:</label>
        <input type="Lname" id="Lname" placeholder="Enter your Last name " required />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required />
        
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required />
        <label for="conpassword">Confirm Password:</label>
        <input type="password" id="password" placeholder="confirm your password" required />
        
        <button type="submit">CREATE ACCOUNT</button>
        <p class="signup-msg">
          Already have an account? <a href="login.html">Login</a>
        </p>
        
      </form>
    </div>
  </div>
</body>
</html>
